name: Documentation improvement
description: Suggest a public-safe documentation clarification.
title: "[docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Which document or section needs improvement?
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear?
      description: Explain the gap, contradiction, or improvement.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed wording or direction
      description: Optional public-safe wording.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have not included secrets, private state, private bookmarks, personal memory, local paths, or account data.
          required: true
